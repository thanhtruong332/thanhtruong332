<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030505"/>
      <stop offset="0.5" stop-color="#081712"/>
      <stop offset="1" stop-color="#030505"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="grunge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.9" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- circuit-board traces -->
  <g stroke="#0FbF6C" stroke-width="1.3" fill="none" opacity="0.30">
    <path d="M0,36 H150 V78 H320 V36 H470"/>
    <path d="M0,96 H90 V60 H0"/>
    <path d="M0,224 H130 V182 H280 V224 H430 V182 H520"/>
    <path d="M0,150 H60 V190 H0"/>
    <path d="M1200,52 H1050 V96 H900 V52 H730"/>
    <path d="M1200,120 H1120 V80 H1200"/>
    <path d="M1200,210 H1060 V168 H930 V210 H760"/>
    <path d="M1200,168 H1160 V140 H1200"/>
    <path d="M150,0 V36"/>
    <path d="M320,260 V36" opacity="0"/>
    <path d="M280,260 V224"/>
    <path d="M430,260 V182"/>
    <path d="M1050,0 V52"/>
    <path d="M900,260 V52" opacity="0"/>
    <path d="M930,0 V210"/>
    <path d="M760,0 V210" opacity="0"/>
  </g>
  <g fill="#0FbF6C" opacity="0.5">
    <circle cx="150" cy="36" r="2.4"/>
    <circle cx="150" cy="78" r="2.4"/>
    <circle cx="320" cy="78" r="2.4"/>
    <circle cx="320" cy="36" r="2.4"/>
    <circle cx="90" cy="96" r="2.4"/>
    <circle cx="90" cy="60" r="2.4"/>
    <circle cx="130" cy="224" r="2.4"/>
    <circle cx="130" cy="182" r="2.4"/>
    <circle cx="280" cy="182" r="2.4"/>
    <circle cx="280" cy="224" r="2.4"/>
    <circle cx="430" cy="224" r="2.4"/>
    <circle cx="430" cy="182" r="2.4"/>
    <circle cx="1050" cy="52" r="2.4"/>
    <circle cx="1050" cy="96" r="2.4"/>
    <circle cx="900" cy="96" r="2.4"/>
    <circle cx="900" cy="52" r="2.4"/>
    <circle cx="1120" cy="120" r="2.4"/>
    <circle cx="1120" cy="80" r="2.4"/>
    <circle cx="1060" cy="210" r="2.4"/>
    <circle cx="1060" cy="168" r="2.4"/>
    <circle cx="930" cy="168" r="2.4"/>
    <circle cx="930" cy="210" r="2.4"/>
  </g>

  <!-- traveling signal pulses -->
  <circle r="3.6" fill="#5CFFB0" filter="url(#glow)">
    <animateMotion dur="4.2s" repeatCount="indefinite"
      path="M0,36 H150 V78 H320 V36 H470"/>
  </circle>
  <circle r="3.6" fill="#5CFFB0" filter="url(#glow)">
    <animateMotion dur="5.6s" repeatCount="indefinite"
      path="M1200,52 H1050 V96 H900 V52 H730"/>
  </circle>
  <circle r="3.2" fill="#8CFFC8" filter="url(#glow)">
    <animateMotion dur="6.4s" repeatCount="indefinite" begin="1s"
      path="M0,224 H130 V182 H280 V224 H430 V182 H520"/>
  </circle>
  <circle r="3.2" fill="#8CFFC8" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" begin="0.6s"
      path="M1200,210 H1060 V168 H930 V210 H760"/>
  </circle>

  <!-- scanlines -->
  <rect width="1200" height="260" fill="url(#scan)"/>

  <!-- vignette -->
  <rect width="1200" height="260" fill="url(#vignette)"/>

  <!-- cracked red streak -->
  <path d="M300,158 L400,153 L440,160 L520,155 L620,159 L760,154 L900,158"
        stroke="#c8102e" stroke-width="2.2" fill="none" opacity="0.85" filter="url(#softglow)">
    <animate attributeName="opacity" values="0.9;0.35;0.85;0.5;0.9" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- title -->
  <text x="600" y="118" text-anchor="middle"
        font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
        font-size="64" letter-spacing="3" filter="url(#grunge)">
    <tspan fill="#e8112d">T</tspan><tspan fill="#f2f2f2">RAN </tspan><tspan fill="#e8112d">T</tspan><tspan fill="#f2f2f2">HANH </tspan><tspan fill="#e8112d">T</tspan><tspan fill="#f2f2f2">RUONG</tspan>
  </text>

  <!-- subtitle -->
  <text x="600" y="182" text-anchor="middle"
        font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
        font-size="26" letter-spacing="10" fill="#d9d9d9" filter="url(#grunge)">EMBEDDED SYSTEMS</text>
</svg>
